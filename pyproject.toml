    "pillow>=13.0.0",
    "playwright>=1.40.0",
    "pydantic>=2.9.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "shortcuts>=0.11.0",
    "urllib3>=2.8.0",
